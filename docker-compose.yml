services:
  db:
    image: postgres:19
    environment:
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ums
      POSTGRES_DB: user_mgmt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums -d user_mgmt"]
      interval: 2s
      timeout: 5s
      retries: 15

  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "1080:1080"
      - "1025:1025"

  otel-lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ums:ums@db:5432/user_mgmt
      JWT_SECRET: dev-only-change-me-32bytes-min!!
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: user-management-api
    depends_on:
      db:
        condition: service_healthy
      otel-lgtm:
        condition: service_started

  outbox-worker:
    build: .
    command: ["python", "-m", "app.outbox.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://ums:ums@db:5432/user_mgmt
      JWT_SECRET: dev-only-change-me-32bytes-min!!
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@user-mgmt.local
      OUTBOX_POLL_SECONDS: "2"
      OUTBOX_BATCH_SIZE: "20"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: user-management-outbox-worker
    depends_on:
      db:
        condition: service_healthy
      maildev:
        condition: service_started
      otel-lgtm:
        condition: service_started
