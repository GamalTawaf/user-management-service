services:
  db:
    image: postgres:19
    environment:
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ums
      POSTGRES_DB: user_mgmt
    ports:
      # Host 5433 avoids clash with other local Postgres stacks on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums -d user_mgmt"]
      interval: 2s
      timeout: 5s
      retries: 15

  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "1080:1080"
      - "1025:1025"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  otel-lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    # Image HEALTHCHECK covers Grafana/Loki/Tempo/collector; wait for it
    # before api/worker so OTLP HTTP to :4318 is not a startup race.

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ums:ums@db:5432/user_mgmt
      JWT_SECRET: dev-only-change-me-32bytes-min!!
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_CAPACITY: "120"
      RATE_LIMIT_REFILL_PER_SECOND: "2"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: user-management-api
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy

  outbox-worker:
    build: .
    command: ["python", "-m", "app.outbox.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://ums:ums@db:5432/user_mgmt
      JWT_SECRET: dev-only-change-me-32bytes-min!!
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@user-mgmt.local
      OUTBOX_POLL_SECONDS: "2"
      OUTBOX_BATCH_SIZE: "20"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: user-management-outbox-worker
      LOG_LEVEL: INFO

    depends_on:
      db:
        condition: service_healthy
      maildev:
        condition: service_started
      otel-lgtm:
        condition: service_healthy
