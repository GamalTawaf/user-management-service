name: Setup project
description: Install uv (Node 24 action) and sync the project for Python 3.15
inputs:
  sync:
    description: Run `uv sync` after install
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: "3.15"
    - name: uv sync
      if: inputs.sync == 'true'
      shell: bash
      run: |
        uv sync
        {
          echo "### uv sync: PASSED"
          echo ""
          echo "Installed prod + dependency-groups.dev for Python 3.15"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
