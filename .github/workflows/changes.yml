name: changes

on:
  workflow_call:
    outputs:
      code:
        description: Whether code-related paths changed (full suite vs meta-only no-op)
        value: ${{ jobs.changes.outputs.code }}

# Always runs so required checks (lint/test/mutate/image) can no-op on meta-only PRs
# without leaving those contexts "missing" for branch protection.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'tests/**'
              - 'alembic/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'setup.cfg'
              - 'alembic.ini'
              - '.python-version'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'postman/User_Management_API.postman_collection.json'
              - 'postman/User_Management_API.postman_environment.json'
