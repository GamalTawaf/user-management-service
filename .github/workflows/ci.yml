name: ci
on:
  push:
    branches: [main]
  pull_request:

# One run per PR (or per branch on main); newer pushes cancel the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Thin orchestrator — job bodies live in workflow_call files beside this one.
# Nested check names are "lint / lint" etc. (see .github/repo-settings.json).
jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  lint:
    needs: changes
    uses: ./.github/workflows/lint.yml
    with:
      code: ${{ needs.changes.outputs.code == 'true' }}

  test:
    needs: changes
    uses: ./.github/workflows/test.yml
    with:
      code: ${{ needs.changes.outputs.code == 'true' }}

  mutate:
    needs: changes
    uses: ./.github/workflows/mutate.yml
    with:
      code: ${{ needs.changes.outputs.code == 'true' }}

  image:
    needs: [changes, lint, test, mutate]
    uses: ./.github/workflows/image.yml
    with:
      code: ${{ needs.changes.outputs.code == 'true' }}
