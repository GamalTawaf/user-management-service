name: mutate

on:
  workflow_call:
    inputs:
      code:
        description: Run mutmut when true; otherwise succeed as a meta-only no-op
        type: boolean
        required: true

env:
  DATABASE_URL: postgresql+psycopg://ums:ums@localhost:5432/user_mgmt
  JWT_SECRET: ci-secret-32-bytes-minimum-key!!

jobs:
  mutate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: ums
          POSTGRES_PASSWORD: ums
          POSTGRES_DB: user_mgmt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ums -d user_mgmt"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: skip (meta-only change)
        if: ${{ !inputs.code }}
        run: echo "Skipping mutate — no code paths changed"
      - uses: actions/checkout@v7
        if: ${{ inputs.code }}
      - uses: ./.github/actions/setup-project
        if: ${{ inputs.code }}
      - name: alembic migrate
        if: ${{ inputs.code }}
        run: ./scripts/ci_run.sh "alembic upgrade head" -- uv run alembic upgrade head
      - name: mutmut users services
        if: ${{ inputs.code }}
        env:
          MUTMUT_MAX_SURVIVORS: "0"
        run: ./scripts/ci_run.sh "mutmut" --tail 40 -- ./scripts/run_mutmut.sh
