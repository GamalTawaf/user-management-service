[project]
name = "user-management-api"
version = "0.1.0"
description = "User Management API — portfolio service (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "redis>=5.0.0",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "mutmut>=3.8.1",
    "pytest>=9.2.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
